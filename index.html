<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>資産</title>
<style>
  :root{
    --bg:#FFFFFF; --card:#F6F7F9; --card2:#EEF0F3;
    --text:#0C0E12; --sub:#9AA1AB; --ghost:#E4E7EB; --line:#E8EAEE;
    --acc:#15B66E; --accbg:rgba(21,182,110,0.10);
    --red:#E5484D; --redbg:rgba(229,72,77,0.09);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{max-width:480px;margin:0 auto;min-height:100vh;
    padding:0 20px calc(40px + env(safe-area-inset-bottom));}
  button,input{font-family:inherit;color:inherit;outline:none;}
  button{cursor:pointer;border:none;background:none;}

  /* ===== 総資産 ===== */
  .hero{padding:calc(54px + env(safe-area-inset-top)) 4px 42px;text-align:center;}
  .hero .lbl{font-size:11px;letter-spacing:3px;color:var(--sub);
    text-transform:uppercase;font-weight:600;}
  .counter{margin-top:14px;display:inline-flex;align-items:baseline;
    justify-content:center;font-weight:700;font-variant-numeric:tabular-nums;}
  .counter .yen{font-size:24px;font-weight:600;color:var(--sub);margin-right:7px;}
  .counter .digits{font-size:44px;line-height:1;display:inline-flex;}
  .counter .digits span{display:inline-block;width:0.60em;text-align:center;}
  .counter .digits .g{color:var(--ghost);}
  .counter .digits .c{color:var(--sub);width:0.30em;}
  .counter .digits .c.g{color:var(--ghost);}

  /* ===== リスト ===== */
  .list{display:flex;flex-direction:column;gap:10px;}
  .card{background:var(--card);border-radius:18px;overflow:hidden;
    transition:background .18s,box-shadow .18s;}
  .card.open{background:var(--card2);box-shadow:0 0 0 1px var(--line) inset;}
  .row{display:flex;align-items:center;width:100%;padding:17px 18px;gap:13px;text-align:left;}
  .row .dot{width:7px;height:7px;border-radius:50%;background:var(--sub);flex:none;
    transition:background .18s,box-shadow .18s;}
  .card.open .row .dot{background:var(--acc);box-shadow:0 0 8px var(--acc);}
  .row .nm{flex:1;font-size:15px;font-weight:500;letter-spacing:0.3px;}

  .mini{display:inline-flex;align-items:baseline;font-weight:600;
    font-variant-numeric:tabular-nums;}
  .mini .y{font-size:11px;color:var(--sub);margin-right:3px;font-weight:500;}
  .mini .digits{font-size:16px;display:inline-flex;}
  .mini .digits span{display:inline-block;width:0.58em;text-align:center;}
  .mini .digits .g{color:var(--ghost);}
  .mini .digits .c{color:var(--sub);width:0.28em;}
  .mini .digits .c.g{color:var(--ghost);}

  /* ===== 編集（＋−） ===== */
  .pad{max-height:0;overflow:hidden;transition:max-height .24s cubic-bezier(.4,0,.2,1);}
  .card.open .pad{max-height:120px;}
  .pad-in{padding:0 16px 16px;display:flex;align-items:center;gap:10px;}
  .amt-in{flex:1;background:transparent;border:none;
    border-bottom:1px solid var(--line);
    font-size:20px;font-weight:600;text-align:center;
    padding:7px 0;color:var(--text);font-variant-numeric:tabular-nums;}
  .amt-in:focus{border-bottom-color:var(--text);}
  .amt-in::placeholder{color:var(--sub);font-weight:400;font-size:15px;}
  .opbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;
    font-size:22px;font-weight:500;color:var(--text);flex:none;line-height:1;
    transition:transform .08s,background .12s;}
  .opbtn:active{background:var(--card);transform:scale(0.94);}

  /* ===== 履歴 ===== */
  .hist{margin-top:34px;}
  .hist-lbl{font-size:11px;letter-spacing:2.5px;color:var(--sub);
    text-transform:uppercase;font-weight:600;padding:0 4px 12px;}
  .hist-row{display:flex;align-items:center;gap:12px;padding:13px 4px;
    border-bottom:1px solid var(--line);width:100%;text-align:left;}
  .hist-row .when{font-size:12px;color:var(--sub);width:78px;flex:none;
    font-variant-numeric:tabular-nums;}
  .hist-row .who{flex:1;font-size:14px;font-weight:500;}
  .hist-row .delta{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
  .hist-row .delta.plus{color:var(--acc);}
  .hist-row .delta.minus{color:var(--red);}
  .hist-row:active{opacity:0.5;}
  .hist-empty{text-align:center;color:var(--sub);font-size:13px;padding:20px 0;}

  .toast{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(30px + env(safe-area-inset-bottom));
    background:var(--text);color:#fff;
    font-size:13px;padding:11px 20px;border-radius:24px;opacity:0;
    transition:opacity .2s;pointer-events:none;z-index:10;
    font-variant-numeric:tabular-nums;}
  .toast.show{opacity:0.94;}
</style>
</head>
<body>

<div class="hero">
  <div class="lbl">Total Balance</div>
  <div class="counter">
    <span class="yen">¥</span>
    <span class="digits" id="digits"></span>
  </div>
</div>

<div class="list" id="list"></div>

<div class="hist">
  <div class="hist-lbl">History</div>
  <div id="histList"></div>
</div>

<div class="toast" id="toastEl"></div>

<script>
/* データ:
   { assets:[{id,name,balance}],
     history:[{id, assetId, delta, ts}] }   delta>0=増, <0=減 */
const KEY='shisan_v2';
const WIDTH=8;
let state=load();
let openId=null;

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ const d=JSON.parse(raw); if(!d.history) d.history=[]; return d; }
    const old=localStorage.getItem('shisan_v1');
    if(old){ const d=JSON.parse(old);
      if(d.assets) return {assets:d.assets.map(a=>({id:a.id,name:a.name,balance:a.balance})),history:[]}; }
  }catch(e){}
  return {assets:['現金','PayPay','メルペイ','銀行','Suica'].map(n=>({id:uid(),name:n,balance:0})),history:[]};
}
function save(){ localStorage.setItem(KEY,JSON.stringify(state)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmt(n){ return n.toLocaleString('ja-JP'); }
function num(v){ const n=parseInt(String(v).replace(/[^0-9]/g,''),10); return isNaN(n)?0:n; }

function toast(m){
  const t=document.getElementById('toastEl');
  t.textContent=m; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),1600);
}

function paintCounter(el, total){
  const neg=total<0;
  const ds=String(Math.abs(total));
  const width=Math.max(WIDTH, ds.length);
  const padded=ds.padStart(width,'0');
  const firstReal=width-ds.length;
  el.innerHTML='';
  if(neg){ const m=document.createElement('span'); m.className='c'; m.textContent='-'; el.appendChild(m); }
  for(let i=0;i<padded.length;i++){
    const posFromRight=padded.length-i;
    if(i>0 && posFromRight%3===0){
      const c=document.createElement('span');
      c.className='c'+(i<=firstReal?' g':'');
      c.textContent=','; el.appendChild(c);
    }
    const s=document.createElement('span');
    s.className=(i<firstReal?'g':'');
    s.textContent=padded[i];
    el.appendChild(s);
  }
}

function fmtWhen(ts){
  const d=new Date(ts);
  return (d.getMonth()+1)+'/'+d.getDate()+' '+
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function render(){
  paintCounter(document.getElementById('digits'),
    state.assets.reduce((s,a)=>s+a.balance,0));

  // 資産リスト
  const list=document.getElementById('list');
  list.innerHTML='';
  state.assets.forEach(a=>{
    const card=document.createElement('div');
    card.className='card'+(openId===a.id?' open':'');

    const row=document.createElement('button');
    row.className='row';
    row.innerHTML='<span class="dot"></span><span class="nm"></span>'+
      '<span class="mini"><span class="y">¥</span><span class="digits" id="d_'+a.id+'"></span></span>';
    row.querySelector('.nm').textContent=a.name;
    row.onclick=()=>{ openId=(openId===a.id?null:a.id); render();
      if(openId===a.id) setTimeout(()=>document.getElementById('amt_'+a.id)?.focus(),260); };
    card.appendChild(row);

    const pad=document.createElement('div');
    pad.className='pad';
    pad.innerHTML=
      '<div class="pad-in">'+
        '<button class="opbtn" data-op="minus">−</button>'+
        '<input class="amt-in" id="amt_'+a.id+'" type="text" inputmode="numeric" placeholder="金額">'+
        '<button class="opbtn" data-op="plus">＋</button>'+
      '</div>';
    const input=pad.querySelector('.amt-in');
    input.oninput=e=>{ e.target.value=e.target.value===''?'':fmt(num(e.target.value)); };
    pad.querySelector('[data-op="minus"]').onclick=()=>applyOp(a,-1,input);
    pad.querySelector('[data-op="plus"]').onclick=()=>applyOp(a,1,input);
    card.appendChild(pad);

    list.appendChild(card);
    paintCounter(card.querySelector('#d_'+a.id), a.balance);
  });

  renderHistory();
}

function renderHistory(){
  const el=document.getElementById('histList');
  el.innerHTML='';
  const items=[...state.history].sort((a,b)=>b.ts-a.ts).slice(0,50);
  if(items.length===0){
    el.innerHTML='<div class="hist-empty">まだ記録はありません</div>';
    return;
  }
  items.forEach(h=>{
    const a=state.assets.find(x=>x.id===h.assetId);
    const row=document.createElement('button');
    row.className='hist-row';
    const plus=h.delta>0;
    row.innerHTML='<span class="when"></span><span class="who"></span>'+
      '<span class="delta '+(plus?'plus':'minus')+'"></span>';
    row.querySelector('.when').textContent=fmtWhen(h.ts);
    row.querySelector('.who').textContent=a?a.name:'(削除済み)';
    row.querySelector('.delta').textContent=(plus?'＋':'−')+'¥'+fmt(Math.abs(h.delta));
    row.onclick=()=>undoHistory(h.id);
    el.appendChild(row);
  });
}

function applyOp(a,sign,input){
  const v=num(input.value);
  if(v<=0){ toast('金額を入力してください'); return; }
  const delta=sign*v;
  a.balance+=delta;
  state.history.push({id:uid(),assetId:a.id,delta,ts:Date.now()});
  openId=null; save(); render();
  toast((sign>0?'＋':'−')+'¥'+fmt(v)+'  →  '+a.name+' ¥'+fmt(a.balance));
}

function undoHistory(hid){
  const i=state.history.findIndex(h=>h.id===hid);
  if(i<0) return;
  const h=state.history[i];
  const a=state.assets.find(x=>x.id===h.assetId);
  if(!confirm('この記録を取り消しますか？\n'+(a?a.name:'')+' '+(h.delta>0?'＋':'−')+'¥'+fmt(Math.abs(h.delta)))) return;
  if(a) a.balance-=h.delta;       // 残高を元に戻す
  state.history.splice(i,1);
  save(); render(); toast('取り消しました');
}

render();
</script>
</body>
</html>
